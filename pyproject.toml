# The workspace: interface libraries, implementations of what they define, products, and environments.
#   uv sync                 everything that needs no GPU
#   uv sync --all-extras    with the engine, the trainer, the model families' renderers (Linux, NVIDIA GPU) and Tinker
[project]
name = "rollout-workspace"
version = "0.0.0"
description = "Durable, scalable agents and environments for agent products and reinforcement learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rollout[http]",
    "rollout-train[http,report]",
    "rollout-durable",
    "rollout-computers",
    "rollout-openai",
    "rollout-s3",
    "rollout-runpod",
    "project-assistant",
    "agent-sessions",
    "minecraft-team",
    "gridworld",
]

[project.optional-dependencies]
gpu = ["rollout-vllm", "rollout-lora", "rollout-qwen"]
gemma = ["rollout-gemma"]
tinker = ["rollout-tinker"]  # a trainer and an engine at Thinking Machines

[tool.uv.workspace]
members = ["libraries/*", "implementations/*", "products/*", "environments/minecraft", "environments/gridworld"]
exclude = ["implementations/rollout-verifiers"]  # a project of its own, locked apart

[tool.uv.sources]
rollout = { workspace = true }
rollout-train = { workspace = true }
rollout-durable = { workspace = true }
rollout-vllm = { workspace = true }
rollout-lora = { workspace = true }
rollout-qwen = { workspace = true }
rollout-gemma = { workspace = true }
rollout-computers = { workspace = true }
rollout-openai = { workspace = true }
rollout-s3 = { workspace = true }
rollout-runpod = { workspace = true }
rollout-tinker = { workspace = true }
project-assistant = { workspace = true }
agent-sessions = { workspace = true }
minecraft-team = { workspace = true }
gridworld = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1.407",
    "pgembed>=0.2",
    "moto[server]>=5.1",
    "boto3-stubs[s3]>=1.40",
    "openai>=3.19",  # the official clients, against the gateway's OpenAI and Anthropic APIs
    "anthropic>=1.8",
    "cryptography>=46",  # test certificate authorities, for mutual TLS with pods
    "pyyaml>=6",  # reading the pods' proxy configuration and the chart in tests
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Code in docs/ is illustrative and hand-aligned for reading; .claude/ holds agents' working copies.
extend-exclude = ["docs", ".claude"]
src = ["libraries/*/src", "implementations/*/src", "products/*/src", "environments/minecraft", "environments/gridworld", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# Task subclasses declare `models`, `imports` and hints as plain class attributes; the base declares the ClassVar.
ignore = ["RUF012"]

[tool.pyright]
include = ["libraries", "implementations", "products", "environments", "tests", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
extraPaths = [
    "libraries/rollout/src",
    "libraries/rollout-train/src",
    "implementations/rollout-durable/src",
    "implementations/rollout-vllm/src",
    "implementations/rollout-lora/src",
    "implementations/rollout-qwen/src",
    "implementations/rollout-gemma/src",
    "implementations/rollout-computers/src",
    "implementations/rollout-openai/src",
    "implementations/rollout-s3/src",
    "implementations/rollout-runpod/src",
    "implementations/rollout-tinker/src",
    "implementations/rollout-verifiers/src",
    "products/project-assistant/src",
    "products/agent-sessions/src",
    "environments/minecraft",
    "environments/gridworld",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "environments"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-m", "not live"]
markers = [
    "live: needs what a test cannot start alone, a Paper server (Java, and the network once) or the GPU; run with `-m live`",
]
pythonpath = ["."]  # (so that `tests.…` imports the shared test helpers, however the tests are collected)

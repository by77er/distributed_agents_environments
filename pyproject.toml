[project]
name = "rollout"
version = "0.0.0"
description = "Durable, scalable agents and environments for agent products and reinforcement learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "rfc8785>=0.1.4",
    "httpx>=0.28",
]

[project.scripts]
rollout = "rollout.cli:main"
project-assistant = "project_assistant.__main__:main"
agents = "agent_sessions.cli:main"
minecraft-swarm = "minecraft_swarm.cli:main"

[project.optional-dependencies]
vllm = ["vllm>=0.30; sys_platform == 'linux'", "transformers>=4.57"]
training = [
    "torch>=2.5",
    "numpy>=2",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "accelerate>=1.0",  # transformers places a model on a device with it
    "flash-linear-attention>=0.5",  # the kernels of Qwen3.5's linear-attention layers
]
durable = ["dbos>=3.1", "sqlalchemy>=2"]
http = ["starlette>=0.48", "uvicorn>=0.37"]
report = ["matplotlib>=3.9"]
minecraft = ["pyyaml>=6"]
assistant = [
    "pillow>=11",
    "starlette>=0.48",
    "uvicorn>=0.37",
]
s3 = [
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1.407",
    "pgembed>=0.2",
    "moto[server]>=5.1",
    "boto3-stubs[s3]>=1.40",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout", "src/project_assistant", "src/agent_sessions", "environments/minecraft/minecraft_swarm"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Code in docs/ is illustrative and hand-aligned for reading.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# Task subclasses declare `models`, `imports` and hints as plain class attributes; the base declares the ClassVar.
ignore = ["RUF012"]

[tool.pyright]
include = ["src", "tests", "scripts", "environments"]
extraPaths = ["src", "environments/minecraft"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "environments"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

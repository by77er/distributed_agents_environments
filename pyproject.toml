[project]
name = "rollout"
version = "0.0.0"
description = "Durable, scalable agents and environments for agent products and reinforcement learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "rfc8785>=0.1.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
vllm = ["vllm>=0.30; sys_platform == 'linux'", "transformers>=4.57"]
recorder = ["renderers>=0.1.11"]
durable = ["dbos>=3.1"]
mcp = ["mcp>=1.20"]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1.407",
]

[tool.uv]
# The SGLang extra is added with its adapter in milestone M3: SGLang pins a different torch than vLLM and
# (0.5.9) a pyyaml older than DBOS accepts, so it will need `conflicts` entries.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Code in docs/ is illustrative and hand-aligned for reading.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# Task subclasses declare `models`, `imports` and hints as plain class attributes; the base declares the ClassVar.
ignore = ["RUF012"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

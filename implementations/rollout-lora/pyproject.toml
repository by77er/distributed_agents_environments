[project]
name = "rollout-lora"
version = "0.0.0"
description = "A Trainer for 4-bit checkpoints with LoRA"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "rollout-train",
    "torch>=2.5",
    "numpy>=2",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "transformers>=4.57",
    "accelerate>=1.0",
    "flash-linear-attention>=0.5",
]

[tool.uv.sources]
rollout = { workspace = true }
rollout-train = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_lora"]

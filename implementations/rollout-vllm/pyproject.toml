[project]
name = "rollout-vllm"
version = "0.0.0"
description = "An Engine on vLLM"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "rollout-train",
    "vllm>=0.30; sys_platform == 'linux'",
    "transformers>=4.57",
]

[tool.uv.sources]
rollout = { workspace = true }
rollout-train = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_vllm"]

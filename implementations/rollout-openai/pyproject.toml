[project]
name = "rollout-openai"
version = "0.0.0"
description = "A ModelEndpoint for the OpenAI Responses API"
requires-python = ">=3.13"
dependencies = [
    "rollout",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_openai"]

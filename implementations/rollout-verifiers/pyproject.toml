[project]
name = "rollout-verifiers"
version = "0.0.0"
description = "Prime Intellect's verifiers environments, played through the recorder"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "verifiers==0.3.2.dev185; python_full_version < '3.15'",
    "renderers>=0.1.12.dev2; python_full_version < '3.15'",  # what that verifiers needs: a pre-release
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_verifiers"]

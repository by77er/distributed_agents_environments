[project]
name = "rollout-computers"
version = "0.0.0"
description = "Computers for tasks: environment backends and the tools that act on them"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "pillow>=11",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_computers"]

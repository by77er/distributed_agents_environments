[project]
name = "rollout-durable"
version = "0.0.0"
description = "A Runner whose runs survive their process, on DBOS"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "dbos>=3.1",
    "sqlalchemy>=2",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_durable"]

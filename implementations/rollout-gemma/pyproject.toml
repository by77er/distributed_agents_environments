[project]
name = "rollout-gemma"
version = "0.0.0"
description = "Renderers for the Gemma model families"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "rollout-train",
    "transformers>=5.10",
]

[project.entry-points."rollout.renderers"]  # found by the platform, each saying the models it renders (`renders`)
gemma4 = "rollout_gemma:gemma4"

[tool.uv.sources]
rollout = { workspace = true }
rollout-train = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_gemma"]

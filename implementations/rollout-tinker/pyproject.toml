[project]
name = "rollout-tinker"
version = "0.0.0"
description = "A Trainer and an Engine on Thinking Machines' Tinker"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "rollout-train",
    "rollout-lora",  # the objective, its minibatches, and the merge (pure torch: none of its GPU code is imported)
    "tinker==0.32.0",
    "torch>=2.10",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
]

[tool.uv.sources]
rollout = { workspace = true }
rollout-train = { workspace = true }
rollout-lora = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_tinker"]

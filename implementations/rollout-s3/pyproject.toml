[project]
name = "rollout-s3"
version = "0.0.0"
description = "Blobs in S3 or any S3-compatible object store"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "boto3>=1.40",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_s3"]

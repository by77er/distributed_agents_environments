[project]
name = "rollout-qwen"
version = "0.0.0"
description = "Renderers for the Qwen model families"
requires-python = ">=3.13"
dependencies = [
    "rollout-train",
    "transformers>=4.57",
]

[project.entry-points."rollout.renderers"]  # found by the platform, each saying the models it renders (`renders`)
qwen35 = "rollout_qwen:qwen35"
qwen3 = "rollout_qwen:qwen3"

[tool.uv.sources]
rollout-train = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_qwen"]

[project]
name = "rollout-objectives"
version = "0.0.0"
description = "Objectives in torch: the composed losses, the step plan and the step's statistics, for any trainer"
requires-python = ">=3.12"
dependencies = [
    "rollout-train",
    "torch>=2.5",
]

[tool.uv.sources]
rollout-train = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_objectives"]

# The platform in the namespace it is installed into (`rollout`), by role: the stores, a Ray cluster, the gateway, the
# monitors, and the RayJob each run's job is made from. Secrets are made outside the chart and named here
# (deploy/k3s/README.md).

image:
  repository: localhost:30500/rollout-platform  # deploy/images/platform, built in the cluster
  tag: dev
  pullPolicy: Always

# The StorageClass of the platform's volumes: the state volume, the ledger's and the blob store's. Each is a directory
# under /var/lib/rancher/k3s/storage on the node. K3s's `local-path` deletes that directory when its claim is deleted;
# `local-path-retain` (deploy/k3s/storage-class.yaml) keeps it, and is what a fresh install should name. A claim's class
# cannot change once it is made, so an install whose claims are `local-path` keeps that, with its volumes set to Retain
# by hand (deploy/k3s/README.md).
storageClass: local-path

# Where every pod of the platform keeps local state: run directories, Minecraft's servers and worlds, the Hugging Face
# cache. One node, so one volume that every pod mounts (each mount is the same directory on the node).
state:
  claim: state
  size: 200Gi
  path: /root/.cache/rollout  # where pods mount it: the code's `~/.cache/rollout`, the containers running as root

secrets:
  stores: stores              # POSTGRES_PASSWORD, ROOT_ACCESS_KEY_ID, ROOT_SECRET_ACCESS_KEY
  gatewayKeys: gateway-keys   # gateway.keys: one `KID SECRET` line
  tinker: tinker              # TINKER_API_KEY, or credentials.json (what `tinker auth login` writes); optional

# The ledger and the blob store.
stores:
  postgres:
    image: postgres:17
    storage: 20Gi
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
  s3:
    image: versity/versitygw:v1.8.0
    storage: 200Gi
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 2Gi}}
  bucket: rollout-blobs
  prefix: blobs/

# One long-lived Ray cluster, where the monitors check environments imported from git: a head that runs no tasks, a
# GPU group and a CPU group the autoscaler starts from zero when work waits for one and removes after idleSeconds idle.
ray:
  name: ray
  version: "2.59.0"
  idleSeconds: 300
  head:
    resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {memory: 3Gi}}
  gpu:
    maxReplicas: 1
    resources: {requests: {cpu: "4", memory: 8Gi}, limits: {memory: 14Gi, nvidia.com/gpu: 1}}
  cpu:
    maxReplicas: 1
    cpus: "4"
    resources: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 4Gi}}

# Each run's job: a RayJob with a Ray cluster of its own (files/rayjob.yaml), one head pod holding `gpus` of the card
# (its trainer and its engine hosts share it), started again up to backoffLimit times when its driver is lost, and
# removed ttlSeconds after it ends.
rayjob:
  gpus: 1
  backoffLimit: 2
  ttlSeconds: 600
  resources: {requests: {cpu: "4", memory: 8Gi}, limits: {memory: 14Gi, nvidia.com/gpu: 1}}

gateway:
  replicas: 1
  port: 8900
  host: gateway.localhost
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}

# Each monitor serves the page over the cluster config's ledger (and every run in it), or over `where` (a run's
# directory under state.path, or a ledger's URL) where it names one; asks for runs on the cluster config; and imports
# environments from their source with its blob store and the long-lived Ray cluster.
monitors:
  main:
    host: monitor.localhost
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 3Gi}}

ingress:
  className: traefik
  rayHost: ray.localhost      # Ray's dashboard; it asks for the cluster's token

# The platform in the namespace it is installed into (`rollout`), by role: the stores, a Ray cluster, the gateway, the
# monitors, and the RayJob each run's job is made from. Secrets are made outside the chart and named here
# (deploy/k3s/README.md).

image:
  repository: localhost:30500/rollout-platform  # deploy/images/platform, built in the cluster
  tag: dev
  pullPolicy: Always

# The StorageClass of the platform's volumes: the state volume, the ledger's and the blob store's. Each is a directory
# under /var/lib/rancher/k3s/storage on the node. K3s's `local-path` deletes that directory when its claim is deleted;
# `local-path-retain` (deploy/k3s/storage-class.yaml) keeps it, and is what a fresh install should name. A claim's class
# cannot change once it is made, so an install whose claims are `local-path` keeps that, with its volumes set to Retain
# by hand (deploy/k3s/README.md).
storageClass: local-path

# Where every pod of the platform keeps local state: run directories, Minecraft's servers and worlds, the Hugging Face
# cache. One node, so one volume that every pod mounts (each mount is the same directory on the node).
state:
  claim: state
  size: 200Gi
  path: /root/.cache/rollout  # where pods mount it: the code's `~/.cache/rollout`, the containers running as root

secrets:
  stores: stores              # POSTGRES_PASSWORD, ROOT_ACCESS_KEY_ID, ROOT_SECRET_ACCESS_KEY
  gatewayKeys: gateway-keys   # gateway.keys: one `KID SECRET` line
  tinker: tinker              # TINKER_API_KEY, or credentials.json (what `tinker auth login` writes); optional
  providers: providers        # OPENAI_API_KEY, ANTHROPIC_API_KEY: the hosted APIs' keys, for the gateway and runs; optional
  ledger: ledger              # ROLLOUT_LEDGER_TOKEN: the platform's token for the ledger service; optional
  runpod: runpod              # RUNPOD_API_KEY: RunPod's API key, for runs' drivers and the pods' reaper; optional
  stepCa: step-ca             # root_ca.crt and provisioner.jwk: step-ca's root and the key pods' one-time tokens are
                              # signed with; optional
  gatewayTls: gateway-tls     # tls.crt, tls.key, ca.crt: the client certificate (spiffe://rollout/gateway) the gateway
                              # and runs' drivers reach pods with, as cert-manager's step-issuer makes it; optional
  r2: r2                      # a second blob store's two keys, for [stores.r2]; optional: WRITER_ACCESS_KEY_ID,
                              # WRITER_SECRET_ACCESS_KEY (read and write: the platform, trainer pods), READER_ACCESS_KEY_ID,
                              # READER_SECRET_ACCESS_KEY (read only: inference pods)

# The ledger and the blob store.
stores:
  postgres:
    image: postgres:17
    storage: 20Gi
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
  s3:
    image: versity/versitygw:v1.8.0
    storage: 200Gi
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 2Gi}}
  bucket: rollout-blobs
  prefix: blobs/

# One long-lived Ray cluster, where the monitors check environments imported from git: a head that runs no tasks, a
# GPU group and a CPU group the autoscaler starts from zero when work waits for one and removes after idleSeconds idle.
ray:
  name: ray
  version: "2.59.0"
  idleSeconds: 300
  head:
    resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {memory: 3Gi}}
  gpu:
    maxReplicas: 1
    resources: {requests: {cpu: "4", memory: 8Gi}, limits: {memory: 14Gi, nvidia.com/gpu: 1}}
  cpu:
    maxReplicas: 1
    cpus: "4"
    resources: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 4Gi}}

# Each run's job: a RayJob with a Ray cluster of its own (files/rayjob.yaml), started again up to backoffLimit times
# when its driver is lost, and removed ttlSeconds after it ends. Its pods are sized from what the run needs (its driver,
# trainer, engine hosts and bridge, and room for Ray's own processes: rollout_train.demand), so a run on Tinker alone
# asks for no GPU. `resources.limits` is the most one pod may have, one node's worth (a run that needs more gets worker
# pods); `resources.requests` is what a pod asks for where the run's demand is not given; `gpus` is the most GPUs one
# pod holds.
rayjob:
  gpus: 1
  backoffLimit: 2
  ttlSeconds: 30
  resources: {requests: {cpu: "1", memory: 4Gi}, limits: {memory: 14Gi, nvidia.com/gpu: 1}}

# Kueue, installed outside the chart (deploy/k3s/README.md), admits each run's RayJob whole: the RayJob is made
# suspended in the LocalQueue `queue`, and starts once the ClusterQueue's quota holds every pod it asks for, so two runs
# never hold half of what each needs. The chart makes a ResourceFlavor, the ClusterQueue with `quota` for the runs'
# pods (sized for one node with one GPU; the platform's own pods are outside it), and the LocalQueue; the cluster
# config names the queue and states the quota as its [capacity], so a run that asks for more is refused.
kueue:
  enabled: false
  queue: runs                 # the LocalQueue, in the release's namespace
  clusterQueue: rollout
  flavor: rollout
  quota: {cpus: 12, memoryGib: 16, gpus: 1}

# The ledger service (`rollout ledger serve`): the ledger over HTTP for pods outside the cluster (RunPod's), each with a
# token of its own; it checks tokens against ROLLOUT_LEDGER_TOKEN (the Secret `secrets.ledger`). `public` is where those
# pods reach it (the cluster config's [ledger] public, https://…): through the Ingress (`ingress`, with a TLS Secret), a
# Service of type LoadBalancer or NodePort (`service`), or a tunnel set up outside the chart.
ledger:
  enabled: true
  replicas: 1
  port: 8840
  public: ""
  service:
    type: ClusterIP           # LoadBalancer or NodePort to reach it from outside the cluster
    nodePort: null
  ingress:
    enabled: false
    host: ledger.example.com
    tlsSecret: ""
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}

# GPU pods on RunPod: the reaper, a CronJob that deletes the pods no run holds (idle past their provider's idle_stop,
# stale leases', and those RunPod lists with the cluster's tag that no lease names), so no runs means no pods. On when
# the cluster config offers RunPod providers (files/cluster.toml has a commented example).
runpod:
  reaper: false
  schedule: "* * * * *"
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}

gateway:
  replicas: 1
  port: 8900
  host: gateway.localhost
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}

# Each monitor serves the page over the cluster config's ledger (and every run in it), or over `where` (a run's
# directory under state.path, or a ledger's URL) where it names one; asks for runs on the cluster config; and imports
# environments from their source with its blob store and the long-lived Ray cluster.
monitors:
  main:
    host: monitor.localhost
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 3Gi}}

ingress:
  className: traefik
  rayHost: ray.localhost      # Ray's dashboard; it asks for the cluster's token

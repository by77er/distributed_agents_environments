# The cluster the chart is installed into, in docs/guide/cluster.md's format: the ledger in Postgres, blobs in
# versitygw's S3, each run a RayJob made from rayjob.yaml, one 16 GB GPU, Tinker, OpenAI's and Anthropic's models for
# evals and judges, the Minecraft worlds, the gridworld, and GSM8K in rollout-verifiers' Python.
# Every pod finds it at /etc/rollout/cluster.toml (ROLLOUT_CLUSTER). Secrets are named, never written: PGPASSWORD,
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY come from the Secret `stores`, TINKER_API_KEY (or credentials.json)
# from `tinker`, OPENAI_API_KEY and ANTHROPIC_API_KEY from `providers` (the gateway's and runs' pods),
# ROLLOUT_LEDGER_TOKEN from `ledger`, the gateway's keys from `gateway-keys`.
name = "k3s"

[ray]
address = "auto"                              # in a Ray pod: the cluster it is part of (a run's: its RayJob's)
jobs = "http://{{ .Values.ray.name }}-head-svc.{{ .Release.Namespace }}:8265"  # the long-lived cluster: imports' checks
temp_dir = "/tmp/ray"                         # the container's own disk

[kubernetes]                                  # each run's job is a RayJob with a Ray cluster of its own
namespace = "{{ .Release.Namespace }}"
rayjob = "/etc/rollout/rayjob.yaml"
{{- if .Values.kueue.enabled }}
queue = "{{ .Values.kueue.queue }}"                              # Kueue admits each RayJob whole

[capacity]                                    # the ClusterQueue's quota: a run that asks for more is refused
cpus = {{ .Values.kueue.quota.cpus }}
memory_gib = {{ .Values.kueue.quota.memoryGib }}
gpus = {{ .Values.kueue.quota.gpus }}
{{- end }}

[ledger]
url = "{{ include "rollout.ledgerUrl" . }}"  # the password is PGPASSWORD's
token_env = "ROLLOUT_LEDGER_TOKEN"            # the platform's token for the ledger service, and what pods' are signed with
{{- if .Values.ledger.public }}
public = "{{ .Values.ledger.public }}"        # where pods outside the cluster reach the ledger service
{{- end }}

[blobs]
kind = "rollout_s3:S3BlobStore"               # the endpoint and the credentials come from the environment
bucket = "{{ .Values.stores.bucket }}"
prefix = "{{ .Values.stores.prefix }}"

# A second blob store, which RunPod's pods reach (an R2 bucket): a run whose trainer or servers are RunPod's writes its
# blobs there, and every reader finds each blob in the store its reference names. Its keys come from the Secret `r2`:
# R2 scopes a key to a bucket, so a writer's key may write anywhere in it.
# [stores.r2]
# kind = "rollout_s3:S3BlobStore"
# bucket = "rollout"
# prefix = "blobs/"
# endpoint_url = "https://ACCOUNT_ID.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id_env = "R2_WRITER_ACCESS_KEY_ID"
# secret_access_key_env = "R2_WRITER_SECRET_ACCESS_KEY"
# reader = { access_key_id_env = "R2_READER_ACCESS_KEY_ID", secret_access_key_env = "R2_READER_SECRET_ACCESS_KEY" }

# GPU pods on RunPod (docs/deploy/providers.md#gpu-pods-on-runpod): a run leases them when it starts and releases them
# when it ends; a released pod stays warm for idle_stop seconds for the next run with its image and model, and the
# reaper (runpod.reaper) deletes what no run holds. Runs' drivers and the gateway reach pods with the gateway's
# certificate (the Secret gateway-tls) and mint pods' one-time tokens with step-ca's provisioner key (the Secret
# step-ca); pods reach the ledger service at [ledger] public (ledger.public), and step-ca at step_ca's url.
# [tls]
# ca = "/etc/rollout-secrets/tls/ca.crt"
# certificate = "/etc/rollout-secrets/tls/tls.crt"
# key = "/etc/rollout-secrets/tls/tls.key"
#
# [inference.h100]                            # one H100 SXM that trains and samples: a host pod
# kind = "runpod-host"
# image = "ghcr.io/by77er/rollout-host@sha256:DIGEST"
# gpu_types = ["NVIDIA H100 80GB HBM3"]
# cloud = "secure"
# price = 2.69                                # dollars an hour, until RunPod says its own price for the pod
# max_pods = 1
# idle_stop = 600
# memory_fraction = 0.42                      # vLLM's share of the GPU's memory; the trainer has the rest
# store = "r2"
# volume_gb = 100
# step_ca = { url = "https://ca.example.com", provisioner = "launcher", trust = "system", key_file = "/etc/rollout-secrets/step-ca/provisioner.jwk", root = "/etc/rollout-secrets/step-ca/root_ca.crt" }
# [inference.h100.models."Qwen/Qwen3.5-9B"]
# context = 8192
# options = { max_lora_rank = 32, args = "--max-model-len 8192" }
#
# [trainers.h100-lora]                        # its steps on the host's pod
# kind = "runpod-trainer"
# colocate_with = "h100"
# trainer = "lora"
# models = ["Qwen/Qwen3.5-9B"]
# segment_tokens = 8000

[scratch]
directory = "{{ .Values.state.path }}/scratch"

[gateway]
url = "http://gateway.{{ .Release.Namespace }}:{{ .Values.gateway.port }}"
listen = "0.0.0.0:{{ .Values.gateway.port }}"
replicas = {{ .Values.gateway.replicas }}
keys_file = "/etc/rollout-secrets/gateway/gateway.keys"

[monitor]
listen = "0.0.0.0:8765"
feed_episodes = 80

[runners]
places = 8

[guards]
runs_gib = 6                                  # each Minecraft episode runs a Paper server
training_gib = 4

[inference.local-vllm]
kind = "vllm"
gpus = 1
max_logprobs = 20
[inference.local-vllm.models."cyankiwi/Qwen3.5-9B-AWQ-4bit"]
base = "Qwen/Qwen3.5-9B"
context = 8192
options = { gpu_memory_utilization = 0.78, max_num_seqs = 20, max_lora_rank = 96 }
[inference.local-vllm.models."Qwen/Qwen3.5-4B"]
context = 8192
options = { gpu_memory_utilization = 0.78, max_num_seqs = 20, max_lora_rank = 64 }
[inference.local-vllm.models."Qwen/Qwen3-0.6B"]
context = 4096
options = { gpu_memory_utilization = 0.45, max_num_seqs = 32, max_lora_rank = 16 }

[inference.tinker]
kind = "tinker"                               # auth vendor: Tinker's SDK reads TINKER_API_KEY or ~/.tinker
[inference.tinker.models."Qwen/Qwen3.5-9B"]
context = 65536
cost = { input = 0.66, cached_input = 0.132, output = 1.995 }   # dollars per million tokens: Tinker prefill, cached prefill, sample
[inference.tinker.models."Qwen/Qwen3.5-4B"]
context = 65536
cost = { input = 0.33, cached_input = 0.066, output = 1.005 }

# Hosted APIs, metered: what they sample is never trained on, so they serve evals, judges and other slots that are
# not trained. Prices are dollars per million tokens, from each provider's pricing page (OpenAI's
# developers.openai.com/api/docs/pricing, Anthropic's platform.claude.com/docs/en/about-claude/pricing), checked on
# 2026-10-05. Thinking (reasoning) tokens are billed as output tokens. OpenAI prices prompts of more than 272K input
# tokens higher; these are the shorter prompts' prices. `options` say the most a reply writes and what each model takes.
[inference.openai]
kind = "api"
endpoint = "rollout_openai:hosted"            # OpenAI's Responses API
api_key_env = "OPENAI_API_KEY"
concurrency = 16                              # requests at once, from each gateway
[inference.openai.models."gpt-6-astra"]       # the flagship
context = 1050000
cost = { input = 10.0, cached_input = 1.0, output = 50.0 }
options = { max_output_tokens = 128000 }
[inference.openai.models."gpt-6.1-sol"]
context = 1050000
cost = { input = 2.0, cached_input = 0.10, output = 10.0 }
options = { max_output_tokens = 128000 }
[inference.openai.models."gpt-6-luna"]        # the small one
context = 1050000
cost = { input = 0.10, cached_input = 0.01, output = 0.50 }
options = { max_output_tokens = 128000 }

[inference.anthropic]
kind = "api"
endpoint = "rollout_anthropic:hosted"         # Anthropic's Messages API
api_key_env = "ANTHROPIC_API_KEY"
concurrency = 16
[inference.anthropic.models."claude-opus-5-5"]
context = 1000000
cost = { input = 4.0, cached_input = 0.20, output = 20.0 }
options = { max_output_tokens = 128000, thinking = "adaptive", sampling = false, forced_tool_choice = false }
[inference.anthropic.models."claude-sonnet-5-5"]
context = 1000000
cost = { input = 2.0, cached_input = 0.20, output = 10.0 }
options = { max_output_tokens = 128000, thinking = "adaptive", sampling = false, forced_tool_choice = false }
[inference.anthropic.models."claude-haiku-4-5-20251001"]
context = 200000
cost = { input = 1.0, cached_input = 0.10, output = 5.0 }
options = { max_output_tokens = 64000, thinking = "budget" }

[trainers.local-lora]
kind = "lora"
gpus = 1
colocate_with = "local-vllm"                  # the engines sleep while it steps
models = ["cyankiwi/Qwen3.5-9B-AWQ-4bit", "Qwen/Qwen3.5-4B", "Qwen/Qwen3-0.6B"]
segment_tokens = 8000

[trainers.tinker-lora]
kind = "tinker"
models = ["Qwen/Qwen3.5-4B", "Qwen/Qwen3.5-9B"]
segment_tokens = 32768
costs = { "Qwen/Qwen3.5-4B" = { train = 0.737 }, "Qwen/Qwen3.5-9B" = { train = 1.463 } }   # dollars per million tokens trained

[sandboxes.minecraft]
provider = "minecraft_team.worlds:worlds"
size = 6
cpus = 1
memory_gib = 1.75                             # a server and its bots: 1.1 GiB on a staged task, 1.75 walking apart

[environments."minecraft_team.environment:environment"]
python = "platform"

[environments."gridworld.environment:environment"]
python = "platform"

[environments."rollout_verifiers.environments:gsm8k"]
project = "/opt/rollout/source/implementations/rollout-verifiers"
interpreter = "/opt/rollout/verifiers/bin/python"  # where the image built its Python

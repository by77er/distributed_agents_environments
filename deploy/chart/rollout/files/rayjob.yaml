# What each run's job is made from (the cluster config's [kubernetes] rayjob): a RayJob whose Ray cluster is a head pod
# of the platform's image (the run's driver and trainer, and its engine hosts and bridge where the pod holds them),
# torn down when the job ends. `rollout_train.submitting.rendered` fills in each run's name, entrypoint, runtime
# environment and metadata, sizes the head from the run's demand (its requests, Ray's CPUs and GPUs) within this pod's
# limits, adds worker pods made from it where one pod cannot hold the run, and, with Kueue, its queue's label and
# `suspend`; the rest is this file's. Its pods are given everything a run uses (`rollout.runEnv`: the stores, Tinker's
# key, the ledger service's token, the hosted APIs' keys, RunPod's), each by reference to its Secret, and mount the
# gateway's keys, step-ca's root and provisioner key and the gateway's certificate. When the driver or its pod is
# lost, the job is submitted again up to `backoffLimit` times, and the run goes on from the ledger.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  labels:
    app.kubernetes.io/part-of: rollout
spec:
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: {{ .Values.rayjob.ttlSeconds }}
  backoffLimit: {{ .Values.rayjob.backoffLimit }}
  # The pod that submits the job and follows it (KubeRay gives it the `ray job submit` command): it uses 0.06 of a CPU
  # and 130 MiB, measured, and Kueue counts its requests with the run's (rollout_train.demand.SUBMITTER).
  submitterPodTemplate:
    metadata:
      labels: {app: run-submitter}
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: {{ include "rollout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
  rayClusterSpec:
    rayVersion: {{ .Values.ray.version | quote }}
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
        num-gpus: {{ .Values.rayjob.gpus | quote }}
      template:
        metadata:
          labels: {app: run}
        spec:
          {{- if .Values.rayjob.gpus }}
          runtimeClassName: nvidia
          {{- end }}
          containers:
            - name: ray-head
              image: {{ include "rollout.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              workingDir: /opt/rollout/source
              env:
                {{- include "rollout.runEnv" . | nindent 16 }}
                - {name: RAY_ENABLE_UV_RUN_RUNTIME_ENV, value: "0"}
              volumeMounts:
                {{- include "rollout.volumeMounts" (dict "root" . "names" (list "state" "config" "gateway-keys" "tinker" "step-ca" "gateway-tls")) | nindent 16 }}
              resources: {{- toYaml .Values.rayjob.resources | nindent 16 }}
          volumes:
            {{- include "rollout.volumes" (dict "root" . "names" (list "state" "config" "gateway-keys" "tinker" "step-ca" "gateway-tls")) | nindent 12 }}

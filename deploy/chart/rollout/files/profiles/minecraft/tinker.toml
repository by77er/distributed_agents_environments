# environments/minecraft/profiles/tinker.toml with the cluster's stores: the full Qwen3.5-9B trained and sampled at
# Tinker; the Paper servers and the runner stay in the run's Ray pod. The key comes from the Secret `tinker`.
directory = "{{ .Values.state.path }}/runs/team-tinker"
feed_runs = 80
episodes_at_once = 6             # each with a world of its own (`[pools.minecraft]`): memory, not a GPU, is the limit

[ledger]
kind = "rollout_train.database:DatabaseLedger"
url = "{{ include "rollout.ledgerUrl" . }}"  # the password is PGPASSWORD's

[blobs]
kind = "rollout_s3:S3BlobStore"  # the endpoint and the credentials come from the environment
bucket = "{{ .Values.stores.bucket }}"
prefix = "{{ .Values.stores.prefix }}"

[channels.policy]
model = "Qwen/Qwen3.5-9B"        # Tinker's id and the Hub's: rollout_qwen:qwen35 loads its tokenizer from the Hub
renderer = "rollout_qwen:qwen35"
engine = "rollout_tinker:TinkerEngine"
thinking_tokens = 1024
answer_tokens = 400
engines = [{ max_model_len = 8192 }]

[trainer]
kind = "rollout_tinker:TinkerTrainer"
channel = "policy"
rank = 32
learning_rate = 1e-4             # one-gpu.toml's 5e-5, doubled: Tinker's adapters are scaled half as much as ours
segment_tokens = 8000
segments_per_step = 384
tokens_per_step = 16384

[pools.minecraft]                # the worlds, each a Paper server: no more at once than the pod's memory holds
kind = "minecraft_team.worlds:worlds"
size = 6

[memory]
runs_gib = 6                     # each episode runs a Paper server

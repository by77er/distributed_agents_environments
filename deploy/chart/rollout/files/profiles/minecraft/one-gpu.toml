# environments/minecraft/profiles/one-gpu.toml with the cluster's stores: a single vLLM engine and a LoRA trainer that
# shares its card (the engine sleeps while it steps), in the Ray cluster's GPU pod.
directory = "{{ .Values.state.path }}/runs/team"
feed_runs = 80
episodes_at_once = 6             # each with a world of its own (`[pools.minecraft]`), and up to four agents' requests
ray = "auto"                     # reshards run as Ray tasks on the Ray cluster the run's job is part of

[ledger]
kind = "rollout_train.database:DatabaseLedger"
url = "{{ include "rollout.ledgerUrl" . }}"  # the password is PGPASSWORD's

[blobs]
kind = "rollout_s3:S3BlobStore"  # the endpoint and the credentials come from the environment
bucket = "{{ .Values.stores.bucket }}"
prefix = "{{ .Values.stores.prefix }}"

[channels.policy]
model = "cyankiwi/Qwen3.5-9B-AWQ-4bit"
renderer = "rollout_qwen:qwen35"
engine = "rollout_vllm:VllmEngine"
reshard = "rollout_train.resharding:verbatim"   # vLLM loads the trainer's LoRA files as they are
thinking_tokens = 1024           # thoughts here run to a median of 530 tokens and a 95th percentile of 820
answer_tokens = 400              # a tool call takes about 40; a summary of old turns up to this
engines = [{ gpu_memory_utilization = 0.78, max_model_len = 8192, max_num_seqs = 20, max_lora_rank = 32 }]

[trainer]
kind = "rollout_lora:LoraTrainer"
channel = "policy"
colocated = true
rank = 32
learning_rate = 5e-5
segment_tokens = 8000           # peak 12.4 GiB at 8,000 tokens; past the card's memory a step crawls
segments_per_step = 384         # 4 to 8 s each: about half an hour a step

[pools.minecraft]                # the worlds, each a Paper server: no more at once than the pod's memory holds
kind = "minecraft_team.worlds:worlds"
size = 6

[memory]
runs_gib = 6                     # each episode runs a Paper server
training_gib = 4

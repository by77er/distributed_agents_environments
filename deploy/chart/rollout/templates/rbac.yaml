# The monitors' account: a monitor submits each run asked for from its page as a RayJob, reads how it goes, and deletes
# it to stop it (`rollout_train.submitting.RayJobResources`), in the namespace the chart is installed into.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor
  labels: {{- include "rollout.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor
  labels: {{- include "rollout.labels" . | nindent 4 }}
rules:
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [ray.io]
    resources: [rayjobs/status]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor
  labels: {{- include "rollout.labels" . | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: monitor, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: monitor}

# The gateway: stateless replicas that sample every channel a run's start names on the cluster config's providers
# whose servers it reaches, and record every turn, behind a Service (what runs in the cluster reach) and an Ingress
# (what reaches it through Traefik).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: {{ include "rollout.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - rollout
            - gateway
            - --cluster
            - --listen
            - 0.0.0.0:{{ .Values.gateway.port }}
            - --proxied
            - "*"
          env: {{- include "rollout.env" . | nindent 12 }}
          ports: [{containerPort: {{ .Values.gateway.port }}, name: http}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6}
          volumeMounts: {{- include "rollout.volumeMounts" . | nindent 12 }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes: {{- include "rollout.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  selector: {app: gateway}
  ports: [{port: {{ .Values.gateway.port }}, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.gateway.host }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gateway, port: {number: {{ .Values.gateway.port }}}}}}

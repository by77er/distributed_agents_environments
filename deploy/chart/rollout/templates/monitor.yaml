# The monitors: each serves the page over the cluster config's ledger (or a run's directory on the state volume),
# behind a Service and an Ingress through Traefik; asks for runs on the cluster config, each a RayJob it makes with
# its account (templates/rbac.yaml); and imports environments from git with the cluster config's blob store and the
# long-lived Ray cluster (whose job server it reaches with the cluster's token). And an Ingress for Ray's dashboard.
{{- range $name, $monitor := .Values.monitors }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-{{ $name }}
  labels: {{- include "rollout.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: monitor, monitor: {{ $name }}}}
  template:
    metadata: {labels: {app: monitor, monitor: {{ $name }}}}
    spec:
      serviceAccountName: monitor
      containers:
        - name: monitor
          image: {{ include "rollout.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - rollout
            - monitor
            {{- if $monitor.where }}
            - "{{ if contains "://" $monitor.where }}{{ $monitor.where }}{{ else }}{{ $.Values.state.path }}/{{ $monitor.where }}{{ end }}"
            {{- end }}
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --cluster
          env:
            {{- include "rollout.env" $ | nindent 12 }}
            {{- include "rollout.rayClientEnv" $ | nindent 12 }}
          ports: [{containerPort: 8765, name: http}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts: {{- include "rollout.volumeMounts" $ | nindent 12 }}
          resources: {{- toYaml $monitor.resources | nindent 12 }}
      volumes: {{- include "rollout.volumes" $ | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-{{ $name }}
  labels: {{- include "rollout.labels" $ | nindent 4 }}
spec:
  selector: {app: monitor, monitor: {{ $name }}}
  ports: [{port: 8765, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitor-{{ $name }}
  labels: {{- include "rollout.labels" $ | nindent 4 }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $monitor.host }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: monitor-{{ $name }}, port: {number: 8765}}}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-dashboard
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.rayHost }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: {{ .Values.ray.name }}-head-svc, port: {number: 8265}}}}

# What every pod of the platform mounts: the local state's volume, and the cluster config (files/cluster.toml), the
# RayJob each run's job is made from (files/rayjob.yaml) and the presets (files/presets), which name the stores at their
# in-cluster addresses.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.state.claim }}
  labels: {{- include "rollout.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # (uninstalling the chart leaves the run directories)
spec:
  accessModes: [ReadWriteOnce]  # one node: every pod mounts it there
  storageClassName: {{ .Values.storageClass }}
  resources: {requests: {storage: {{ .Values.state.size }}}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rollout
  labels: {{- include "rollout.labels" . | nindent 4 }}
data:
  cluster.toml: |
    {{- tpl (.Files.Get "files/cluster.toml") . | nindent 4 }}
  rayjob.yaml: |
    {{- tpl (.Files.Get "files/rayjob.yaml") . | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/presets/*.toml" }}
  {{ trimPrefix "files/" $path | replace "/" "_" }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}

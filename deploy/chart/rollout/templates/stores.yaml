# The stores: Postgres for the ledger and versitygw (an S3 gateway; buckets are directories) for blobs, each on a
# local-path volume. Credentials come from the Secret `secrets.stores`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.stores.postgres.image }}
          args: [postgres, -c, max_connections=400]  # each runner holds a pool of connections
          env:
            - {name: POSTGRES_USER, value: rollout}
            - {name: POSTGRES_DB, value: rollout}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.stores }}, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, rollout]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {{- toYaml .Values.stores.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: {{ .Values.stores.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  serviceName: s3
  replicas: 1
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
        - name: versitygw
          image: {{ .Values.stores.s3.image }}
          args: [--port, ":7070", posix, /data]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.stores }}, key: ROOT_ACCESS_KEY_ID}}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.stores }}, key: ROOT_SECRET_ACCESS_KEY}}
          ports: [{containerPort: 7070}]
          readinessProbe: {tcpSocket: {port: 7070}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {{- toYaml .Values.stores.s3.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: {{ .Values.stores.s3.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  selector: {app: s3}
  ports: [{port: 7070}]
---
# The bucket, made once the store answers: a hook Job, run again (and its previous run deleted) at each install and
# upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: buckets
  labels: {{- include "rollout.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: amazon/aws-cli:2.27.0
          env:
            - {name: AWS_ENDPOINT_URL, value: "http://s3:7070"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.stores }}, key: ROOT_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.stores }}, key: ROOT_SECRET_ACCESS_KEY}}
          command: [/bin/sh, -c]
          args:
            - >-
              aws s3api head-bucket --bucket {{ .Values.stores.bucket }} 2>/dev/null
              || aws s3api create-bucket --bucket {{ .Values.stores.bucket }}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}

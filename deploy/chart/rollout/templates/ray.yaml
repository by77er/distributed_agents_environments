# The long-lived Ray cluster, where the monitors check environments imported from their source: a head that runs no
# tasks, a GPU group and a CPU group the autoscaler starts from zero when a job waits for one and removes after
# `ray.idleSeconds` idle. Its pods run the platform's image and are given nothing else: no store's key, no Secret, no
# volume. A check runs code imported from anywhere, and needs none of them: the monitor hands the job server the
# environment's zip itself (`rollout_train.publishing`). Clients present the cluster's token, which KubeRay keeps in a
# Secret named after the cluster. Each run's job has a Ray cluster of its own (files/rayjob.yaml).
{{- define "rollout.rayContainer" -}}
image: {{ include "rollout.image" .root }}
imagePullPolicy: {{ .root.Values.image.pullPolicy }}
workingDir: /opt/rollout/source
env:
  - {name: RAY_ENABLE_UV_RUN_RUNTIME_ENV, value: "0"}
resources: {{- toYaml .resources | nindent 2 }}
{{- end }}
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ .Values.ray.name }}
  labels: {{- include "rollout.labels" . | nindent 4 }}
spec:
  rayVersion: {{ .Values.ray.version | quote }}
  enableInTreeAutoscaling: true
  authOptions: {mode: token}
  autoscalerOptions:
    idleTimeoutSeconds: {{ .Values.ray.idleSeconds }}
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
  headGroupSpec:
    rayStartParams:
      num-cpus: "0"
      dashboard-host: 0.0.0.0
    template:
      metadata: {labels: {app: ray-head}}
      spec:
        containers:
          - name: ray-head
            {{- include "rollout.rayContainer" (dict "root" . "resources" .Values.ray.head.resources) | nindent 12 }}
            ports:
              - {containerPort: 6379, name: gcs-server}
              - {containerPort: 8265, name: dashboard}
              - {containerPort: 10001, name: client}
  workerGroupSpecs:
    - groupName: gpu
      replicas: 0
      minReplicas: 0
      maxReplicas: {{ .Values.ray.gpu.maxReplicas }}
      rayStartParams: {}
      template:
        metadata: {labels: {app: ray-worker-gpu}}
        spec:
          runtimeClassName: nvidia
          containers:
            - name: ray-worker
              {{- include "rollout.rayContainer" (dict "root" . "resources" .Values.ray.gpu.resources) | nindent 14 }}
    - groupName: cpu
      replicas: 0
      minReplicas: 0
      maxReplicas: {{ .Values.ray.cpu.maxReplicas }}
      rayStartParams:
        num-cpus: {{ .Values.ray.cpu.cpus | quote }}
      template:
        metadata: {labels: {app: ray-worker-cpu}}
        spec:
          containers:
            - name: ray-worker
              {{- include "rollout.rayContainer" (dict "root" . "resources" .Values.ray.cpu.resources) | nindent 14 }}

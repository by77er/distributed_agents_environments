# The launchers: each claims the runs asked for its profiles and environments, and submits each to the Ray cluster as a
# Ray job. One pod each, with a fixed host name, so that it beats under one name and follows its jobs again when it is
# started again.
{{- range $name, $launcher := .Values.launchers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: launcher-{{ $name }}
  labels: {{- include "rollout.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}  # (never two under one name)
  selector: {matchLabels: {app: launcher, launcher: {{ $name }}}}
  template:
    metadata: {labels: {app: launcher, launcher: {{ $name }}}}
    spec:
      serviceAccountName: launcher
      hostname: launcher-{{ $name }}
      containers:
        - name: launcher
          image: {{ include "rollout.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          workingDir: {{ $launcher.workingDir }}
          command:
            - {{ $launcher.python }}
            - -m
            - rollout_train.cli
            - launcher
            - --ledger
            - {{ include "rollout.ledgerUrl" $ }}
            - --profiles
            - /etc/rollout/profiles/{{ $launcher.profiles }}
            {{- range $launcher.environments }}
            - --environment
            - {{ . }}
            {{- end }}
            - --runs
            - {{ $.Values.state.path }}/runs
            - --at-once
            - {{ $launcher.atOnce | quote }}
            - --ray
            - http://{{ $.Values.ray.name }}-head-svc.{{ $.Release.Namespace }}:8265
            - --gpus
            - {{ $launcher.gpus | quote }}
            - --name
            - {{ $name }}
            - --cluster
          env:
            {{- include "rollout.env" $ | nindent 12 }}
            {{- include "rollout.rayClientEnv" $ | nindent 12 }}
          volumeMounts: {{- include "rollout.volumeMounts" $ | nindent 12 }}
          resources: {{- toYaml $launcher.resources | nindent 12 }}
      volumes: {{- include "rollout.volumes" $ | nindent 8 }}
{{- end }}

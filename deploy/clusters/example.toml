# A cluster of one machine with one 16 GB GPU (an RTX 5080): the ledger in SQLite, blobs in files, vLLM engines on the
# GPU, a LoRA trainer that shares it, Tinker for training and sampling elsewhere, OpenAI's and Anthropic's models for
# evals and judges, the Minecraft worlds, and GSM8K in rollout-verifiers' own Python. Copy it to
# ~/.config/rollout/cluster.toml (or name it with --cluster or ROLLOUT_CLUSTER). docs/guide/cluster.md describes every
# field. Secrets are named here, never written: TINKER_API_KEY, OPENAI_API_KEY and ANTHROPIC_API_KEY are read from the
# environment of whatever samples or trains there, when it does.
name = "home"

[ray]
address = "auto"                              # the head this machine runs
temp_dir = "~/.cache/ray"                     # on disk: /tmp is memory on this machine

[ledger]
url = "sqlite:///~/.cache/rollout/ledger.db"  # every run on this machine shares it

[blobs]
kind = "files"
directory = "~/.cache/rollout/blobs"

[scratch]
directory = "~/.cache/rollout/scratch"

[gateway]
url = "http://127.0.0.1:8830"
listen = "127.0.0.1:8830"
keys_file = "~/.config/rollout/gateway.keys"

[monitor]
feed_episodes = 80

[runners]
places = 8

[guards]
runs_gib = 6                                  # each Minecraft episode runs a Paper server
training_gib = 4

# The GPU, as vLLM engines: each run starts engines of its own on it.
[inference.local-vllm]
kind = "vllm"
gpus = 1
max_logprobs = 20
[inference.local-vllm.models."Qwen/Qwen3.5-4B"]
context = 8192
options = { gpu_memory_utilization = 0.78, max_num_seqs = 20, max_lora_rank = 64 }  # Tinker's rank 16, times 3
[inference.local-vllm.models."cyankiwi/Qwen3.5-9B-AWQ-4bit"]
base = "Qwen/Qwen3.5-9B"                      # an adapter trained over the base is served on it as it is
context = 8192
options = { gpu_memory_utilization = 0.78, max_num_seqs = 20, max_lora_rank = 96 }  # rank 32 from Tinker, times 3
[inference.local-vllm.models."Qwen/Qwen3-0.6B"]
context = 4096
options = { gpu_memory_utilization = 0.45, max_num_seqs = 32, max_lora_rank = 16 }

[inference.tinker]
kind = "tinker"                               # auth vendor: Tinker's SDK reads TINKER_API_KEY
project_env = "TINKER_PROJECT_ID"
[inference.tinker.models."Qwen/Qwen3.5-4B"]
context = 65536
cost = { input = 0.33, cached_input = 0.066, output = 1.005 }   # dollars per million tokens: Tinker prefill, cached prefill, sample
[inference.tinker.models."Qwen/Qwen3.5-9B"]
context = 65536
cost = { input = 0.66, cached_input = 0.132, output = 1.995 }

# Hosted APIs, metered: what they sample is never trained on, so they serve evals, judges and other slots that are
# not trained. Prices are dollars per million tokens, from each provider's pricing page (OpenAI's
# developers.openai.com/api/docs/pricing, Anthropic's platform.claude.com/docs/en/about-claude/pricing), checked on
# 2026-10-05. Thinking (reasoning) tokens are billed as output tokens. OpenAI prices prompts of more than 272K input
# tokens higher; these are the shorter prompts' prices. `options` say the most a reply writes and what each model takes.
[inference.openai]
kind = "api"
endpoint = "rollout_openai:hosted"            # OpenAI's Responses API
api_key_env = "OPENAI_API_KEY"
concurrency = 16                              # requests at once, from each gateway
[inference.openai.models."gpt-6-astra"]       # the flagship
context = 1050000
cost = { input = 10.0, cached_input = 1.0, output = 50.0 }
options = { max_output_tokens = 128000 }
[inference.openai.models."gpt-6.1-sol"]
context = 1050000
cost = { input = 2.0, cached_input = 0.10, output = 10.0 }
options = { max_output_tokens = 128000 }
[inference.openai.models."gpt-6-luna"]        # the small one
context = 1050000
cost = { input = 0.10, cached_input = 0.01, output = 0.50 }
options = { max_output_tokens = 128000 }

[inference.anthropic]
kind = "api"
endpoint = "rollout_anthropic:hosted"         # Anthropic's Messages API
api_key_env = "ANTHROPIC_API_KEY"
concurrency = 16
[inference.anthropic.models."claude-opus-5-5"]
context = 1000000
cost = { input = 4.0, cached_input = 0.20, output = 20.0 }
options = { max_output_tokens = 128000, thinking = "adaptive", sampling = false, forced_tool_choice = false }
[inference.anthropic.models."claude-sonnet-5-5"]
context = 1000000
cost = { input = 2.0, cached_input = 0.20, output = 10.0 }
options = { max_output_tokens = 128000, thinking = "adaptive", sampling = false, forced_tool_choice = false }
[inference.anthropic.models."claude-haiku-4-5-20251001"]
context = 200000
cost = { input = 1.0, cached_input = 0.10, output = 5.0 }
options = { max_output_tokens = 64000, thinking = "budget" }

[trainers.local-lora]
kind = "lora"
gpus = 1
colocate_with = "local-vllm"                  # the engines sleep while it steps
models = ["cyankiwi/Qwen3.5-9B-AWQ-4bit", "Qwen/Qwen3.5-4B", "Qwen/Qwen3-0.6B"]
segment_tokens = 8000                         # peak 12.4 GiB at 8,000 tokens with the 9B

[trainers.local-full]
kind = "full"
gpus = 1
colocate_with = "local-vllm"
models = ["Qwen/Qwen3-0.6B"]
segment_tokens = 4096

[trainers.tinker-lora]
kind = "tinker"
project_env = "TINKER_PROJECT_ID"
models = ["Qwen/Qwen3.5-4B", "Qwen/Qwen3.5-9B"]
segment_tokens = 32768
costs = { "Qwen/Qwen3.5-4B" = { train = 0.737 }, "Qwen/Qwen3.5-9B" = { train = 1.463 } }   # dollars per million tokens trained

[sandboxes.minecraft]
provider = "minecraft_team.worlds:worlds"
size = 6                                      # no more worlds at once than this machine's memory holds
cpus = 2
memory_gib = 1.5

[environments."minecraft_team.environment:environment"]
python = "platform"
[environments."gridworld.environment:environment"]
python = "platform"
[environments."rollout_verifiers.environments:gsm8k"]    # its own lock, built into a cached virtualenv
project = "~/Code/distributed_agents_environments/implementations/rollout-verifiers"

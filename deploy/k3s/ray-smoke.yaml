# A Ray cluster that starts GPU workers on demand: the GPU group sits at zero pods until a task asks for a GPU,
# and the autoscaler removes idle workers after a minute. Apply, then run a GPU task through the head.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: smoke
spec:
  rayVersion: "2.59.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    idleTimeoutSeconds: 60
  headGroupSpec:
    rayStartParams:
      num-cpus: "0"
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.59.0-py312
            resources:
              requests: {cpu: "1", memory: 2Gi}
              limits: {memory: 2Gi}
  workerGroupSpecs:
    - groupName: gpu
      replicas: 0
      minReplicas: 0
      maxReplicas: 1
      rayStartParams: {}
      template:
        spec:
          runtimeClassName: nvidia
          containers:
            - name: ray-worker
              image: rayproject/ray:2.59.0-py312-gpu
              resources:
                requests: {cpu: "2", memory: 4Gi}
                limits: {memory: 4Gi, nvidia.com/gpu: 1}

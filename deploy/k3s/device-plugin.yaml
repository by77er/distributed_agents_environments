# Values for NVIDIA's device plugin chart (nvdp/nvidia-device-plugin) on the WSL2 K3s node.
# The node advertises its one card as one `nvidia.com/gpu`, for one pod at a time (a run's, or the long-lived Ray
# cluster's GPU worker); Ray shares it among that pod's processes with fractional `num_gpus`. Processes outside the
# cluster keep using the card.
runtimeClassName: nvidia

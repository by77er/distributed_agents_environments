# The cluster's root certificate: what a client's certificate must chain to. (Which client: the SAN Envoy's
# configuration matches, the gateway's.)
resources:
  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
    name: cluster_ca
    validation_context:
      trusted_ca:
        filename: /certs/current/ca.crt
      watched_directory:
        path: /certs

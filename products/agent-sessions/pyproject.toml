[project]
name = "agent-sessions"
version = "0.0.0"
description = "Independent agents with their own computers, which create and message each other"
requires-python = ">=3.13"
dependencies = [
    "rollout[http]",
    "rollout-durable",
    "rollout-computers",
    "rollout-openai",
    "rollout-s3",
]

[project.scripts]
agents = "agent_sessions.cli:main"

[tool.uv.sources]
rollout = { workspace = true }
rollout-durable = { workspace = true }
rollout-computers = { workspace = true }
rollout-openai = { workspace = true }
rollout-s3 = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sessions"]

[project]
name = "rollout-train"
version = "0.0.0"
description = "Reinforcement learning on rollout: jobs and episodes, the training loop, channels, the recorder, deployment profiles"
requires-python = ">=3.13"
dependencies = [
    "rollout",
]

[project.scripts]
rollout = "rollout_train.cli:main"

[project.optional-dependencies]
http = ["starlette>=0.48", "uvicorn>=0.37"]  # the rollout service, the endpoint for harnesses, the monitor
report = ["matplotlib>=3.9"]
durable = ["rollout-durable"]  # for a profile whose runner is durable

[tool.uv.sources]
rollout = { workspace = true }
rollout-durable = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_train"]

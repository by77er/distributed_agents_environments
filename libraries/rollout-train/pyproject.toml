[project]
name = "rollout-train"
version = "0.0.0"
description = "Reinforcement learning on rollout: episode runners, the training loop, checkpoints and the ledger, channels, the gateway, the cluster config, the rollout command, the monitor"
requires-python = ">=3.12"
dependencies = [
    "rollout",
    "ray[default]>=2.59",  # every role runs on Ray: runs as jobs, engine hosts as actors, bridges as tasks
    "sqlalchemy>=2",  # the ledger in a database: SQLite on one machine, Postgres for several
    "psycopg[binary]>=3.2",
    "httpx>=0.28",  # clients: the gateway, remote engines, the pods, the monitor
    "packaging>=24",  # reading an imported environment's dependencies (`rollout_train.publishing`)
    "uv>=0.11",  # what Ray installs them with
]

[project.scripts]
rollout = "rollout_train.cli:main"

[project.optional-dependencies]
http = ["starlette>=0.48", "uvicorn>=0.37"]  # the endpoint for harnesses, the monitor
report = ["matplotlib>=3.9"]
runpod = ["rollout-runpod"]  # leasing RunPod's pods for runs, and the certificates the platform holds

[tool.uv.sources]
rollout = { workspace = true }
rollout-runpod = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_train"]

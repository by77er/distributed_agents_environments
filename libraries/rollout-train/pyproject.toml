[project]
name = "rollout-train"
version = "0.0.0"
description = "Reinforcement learning on rollout: the training loop, the scheduler, versions, channels, the recorder, deployment profiles, the monitor"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "ray[default]>=2.59",  # every role runs on Ray: runs as jobs, engine hosts as actors, bridges as tasks
    "sqlalchemy>=2",  # the ledger in a database: SQLite on one machine, Postgres for several
    "psycopg[binary]>=3.2",
]

[project.scripts]
rollout = "rollout_train.cli:main"

[project.optional-dependencies]
http = ["starlette>=0.48", "uvicorn>=0.37"]  # the endpoint for harnesses, the monitor
report = ["matplotlib>=3.9"]
durable = ["rollout-durable"]  # for a profile whose runner is durable

[tool.uv.sources]
rollout = { workspace = true }
rollout-durable = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollout_train"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #f5f6f8; --panel: #ffffff; --raised: #f9fafb; --line: #e4e7ec; --line-strong: #d0d5dd;
    --ink: #101828; --quiet: #5d6676; --faint: #98a2b3; --code: #f2f4f7;
    --accent: #0e9384; --accent-soft: #e6f6f4; --good: #079455; --good-soft: #e7f6ee; --bad: #d92d20; --bad-soft: #fdecea;
    --warm: #dc6803; --warm-soft: #fef3e6; --violet: #6941c6; --violet-soft: #f1ecfb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0d1014; --panel: #151a20; --raised: #1b2128; --line: #252c35; --line-strong: #323b46;
      --ink: #e7eaee; --quiet: #9aa4b2; --faint: #5f6b7a; --code: #0f1318;
      --accent: #2ec4ad; --accent-soft: #10302b; --good: #4ade80; --good-soft: #10291a; --bad: #f87171; --bad-soft: #321616;
      --warm: #fbbf24; --warm-soft: #33270e; --violet: #a78bfa; --violet-soft: #241c3a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); display: flex;
         -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* The hierarchy, on the left */
  aside { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex;
          flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--violet));
                 display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
  .brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--quiet); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
  .tree .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
                 padding: 14px 10px 6px; }
  .node { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--quiet);
          font-size: 13px; cursor: pointer; min-width: 0; }
  .node:hover { background: var(--raised); color: var(--ink); }
  .node.current { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .node .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .num { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; min-width: 30px; }
  .node.top { color: var(--ink); font-weight: 600; font-size: 14px; }
  .node .tag { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .children { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 6px; }
  .children .node { display: grid; grid-template-columns: 34px minmax(0, 1fr) 52px 54px; gap: 8px; }
  .children .node .dots { justify-content: flex-start; overflow: hidden; }
  .children .node .tag { text-align: right; }
  .dots { display: flex; gap: 3px; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  .dots i.solved { background: var(--good); } .dots i.unsolved { background: var(--faint); } .dots i.failed { background: var(--bad); }
  .dots i.running { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }

  /* Content */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 28px; border-bottom: 1px solid var(--line);
         background: var(--panel); min-height: 52px; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--quiet); flex: 1; min-width: 0; }
  .crumbs a:hover { color: var(--ink); } .crumbs .sep { color: var(--faint); } .crumbs b { color: var(--ink); font-weight: 600; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--quiet); white-space: nowrap; }
  main { flex: 1; overflow-y: auto; padding: 24px 28px 48px; }
  .page { max-width: 1400px; margin: 0 auto; display: grid; gap: 20px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; font-weight: 700; text-wrap: balance; }
  .head .sub { color: var(--quiet); font-size: 14px; flex-basis: 100%; margin-top: -6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px;
          border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--quiet); white-space: nowrap; }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .pill.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .pill.warm { background: var(--warm-soft); border-color: transparent; color: var(--warm); }
  .pill.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .pill.violet { background: var(--violet-soft); border-color: transparent; color: var(--violet); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
  .dot.running, .dot.alive { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
  .dot.completed { background: var(--good); } .dot.failed, .dot.cancelled, .dot.gone { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot, .dots i, .stages div::before { animation: none !important; } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
  .kpi span { display: block; font-size: 12px; color: var(--quiet); font-weight: 500; }
  .kpi b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
           margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi small { display: block; color: var(--faint); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .card > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px;
                   padding: 14px 18px 0; }
  .card > header h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
  .card > header span { color: var(--quiet); font-size: 12px; }
  .card .body { padding: 12px 18px 16px; min-width: 0; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 -8px; }
  .section-title h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .section-title span { color: var(--quiet); font-size: 12px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 20px; align-items: start; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
          display: grid; gap: 10px; min-width: 0; align-content: start; transition: border-color .15s, transform .15s; }
  a.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tile header { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tile header b { font-size: 15px; white-space: nowrap; }
  .tile header span.what { color: var(--quiet); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tile .big { font-size: 28px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--quiet); font-size: 12px; }
  .tile .facts b { color: var(--ink); font-weight: 600; }
  .muted { color: var(--quiet); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .empty { color: var(--quiet); padding: 28px 0; text-align: center; }
  .error-text { color: var(--bad); overflow-wrap: anywhere; font-size: 13px; }

  /* The stages a group passes through */
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .stages div { display: grid; gap: 6px; font-size: 11px; color: var(--faint); min-width: 0; }
  .stages div::before { content: ""; height: 4px; border-radius: 4px; background: var(--line); }
  .stages .done { color: var(--quiet); } .stages .done::before { background: var(--accent); opacity: .5; }
  .stages .now { color: var(--ink); font-weight: 600; } .stages .now::before { background: var(--accent); }
  .stages .now.active::before { animation: pulse 1.6s ease-in-out infinite; }
  .stages span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px 3px 8px; border-radius: 999px;
         background: var(--raised); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  a.pip:hover { border-color: var(--accent); }

  /* Tables */
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint);
       padding: 8px 14px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
  tr:last-child td { border-bottom: 0; }
  tr.link { cursor: pointer; } tr.link:hover td { background: var(--raised); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.key { font-weight: 600; white-space: nowrap; }
  .moved { color: var(--good); } .still { color: var(--quiet); } .bad { color: var(--bad); }

  /* Charts */
  svg { display: block; max-width: 100%; }
  svg text { font: 10px var(--sans); fill: var(--faint); }
  .s-grid { stroke: var(--line); stroke-width: 1; }
  .s-accent { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; }
  .s-violet { stroke: var(--violet); stroke-width: 2; fill: none; stroke-linejoin: round; }
  .s-warm { stroke: var(--warm); stroke-width: 2; fill: none; stroke-linejoin: round; }
  .s-ink { stroke: var(--ink); stroke-width: 1.5; }
  .f-accent { fill: var(--accent); } .f-accent-soft { fill: var(--accent); opacity: .14; } .f-violet { fill: var(--violet); }
  .f-violet-soft { fill: var(--violet); opacity: .14; } .f-warm { fill: var(--warm); } .f-warm-soft { fill: var(--warm); opacity: .14; }
  .f-good { fill: var(--good); } .f-quiet { fill: var(--faint); } .f-bad { fill: var(--bad); } .f-none { fill: transparent; }
  .f-hollow { fill: var(--panel); stroke: var(--faint); stroke-width: 1; }
  .column { cursor: pointer; } .column:hover { fill: var(--accent); fill-opacity: .07; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--quiet); font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .legend i.square { border-radius: 2px; } .legend i.hollow { border: 1px solid var(--faint); }
  .legend i.rule { width: 12px; height: 2px; border-radius: 0; vertical-align: 3px; background: var(--ink); }
  .meter { display: grid; gap: 5px; margin-bottom: 14px; }
  .meter div:first-child { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--quiet); }
  .meter b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .track { height: 8px; border-radius: 8px; background: var(--code); overflow: hidden; border: 1px solid var(--line); }
  .track i { display: block; height: 100%; border-radius: 8px; background: var(--accent); }
  .track.warm i { background: var(--warm); } .track.bad i { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line);
          font-variant-numeric: tabular-nums; } .chip b { font-weight: 600; }
  .pairs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; margin: 0; }
  .pairs dt { color: var(--quiet); } .pairs dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; min-width: 0; }

  /* An episode: its agents and their turns */
  .agents { display: flex; flex-wrap: wrap; gap: 6px; }
  .agent-tab { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; cursor: pointer;
               border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 500; }
  .agent-tab.current { border-color: var(--accent); background: var(--accent-soft); }
  .agent-tab.all { padding-left: 12px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px;
            font-weight: 700; flex: none; text-transform: uppercase; }
  .scrub { position: sticky; top: -24px; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
           padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .scrub input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .scrub button { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .scrub output { font-variant-numeric: tabular-nums; min-width: 110px; font-weight: 600; }
  .scrub label { color: var(--quiet); font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .turns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; align-items: start; }
  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
  .turn > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .turn > header b { font-size: 14px; } .turn > header span { margin-left: auto; color: var(--quiet); font-size: 12px; }
  .turn section { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .turn section:last-child { border-bottom: 0; }
  .turn h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  pre { margin: 0; font: 12px/1.35 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .sees pre { background: var(--code); border-radius: 8px; padding: 10px; max-height: 620px; overflow: auto; border: 1px solid var(--line); }
  .thinks p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; color: var(--quiet); max-height: 320px; overflow: auto; }
  .call { display: inline-block; font: 12px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px;
          padding: 3px 8px; overflow-wrap: anywhere; }
  .said { margin: 0 0 6px; font-size: 13px; }
  .result { color: var(--quiet); overflow-wrap: anywhere; white-space: pre-wrap; font-size: 13px; }
  .result.error { color: var(--bad); }
  .none { color: var(--faint); font-size: 13px; }
  .row { white-space: pre; }
  .c-solid { color: var(--quiet); } .c-air { color: var(--faint); } .c-unseen { color: var(--faint); opacity: .45; }
  .c-self { color: var(--accent); font-weight: 700; } .c-mate { color: var(--warm); font-weight: 700; } .c-thing { color: var(--ink); font-weight: 700; }
  details summary { cursor: pointer; color: var(--quiet); font-size: 13px; padding: 2px 0; }
  .menu { display: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; }

  @media (max-width: 900px) {
    body { display: block; height: auto; }
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
    body.open aside { transform: none; }
    .content { min-height: 100vh; }
    main { padding: 16px; overflow: visible; }
    .bar { padding: 10px 16px; position: sticky; top: 0; z-index: 5; }
    .menu { display: block; }
    .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .scrub { top: 52px; }
  }
</style>
</head>
<body>
<aside>
  <a class="brand" href="#/"><div class="mark">R</div><div style="min-width:0"><b>Runs monitor</b><small id="where">connecting…</small></div></a>
  <nav class="tree" id="tree"></nav>
</aside>
<div class="content">
  <div class="bar"><button class="menu" id="menu" aria-label="show the hierarchy">☰</button><div class="crumbs" id="crumbs"></div><div class="live" id="live"></div></div>
  <main id="main"><div class="empty">Reading the run…</div></main>
</div>
<script src="monitor.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #f3f4f1; --panel: #ffffff; --raised: #f7f8f6; --line: #e1e3de; --line-strong: #c9ccc4; --grid: rgba(16, 24, 20, .035);
    --ink: #13171a; --quiet: #5b636b; --faint: #949b9f; --code: #f1f2ef;
    --accent: #0b8a7c; --accent-soft: #e3f3f0; --good: #12823f; --good-soft: #e4f3ea; --bad: #c8331f; --bad-soft: #fbe9e6;
    --warm: #c26a06; --warm-soft: #fbf0e1; --violet: #6345c2; --violet-soft: #eeeafa;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0c0e10; --panel: #13161a; --raised: #191d22; --line: #242a31; --line-strong: #343c45; --grid: rgba(255, 255, 255, .025);
      --ink: #e6e9ec; --quiet: #9aa3ad; --faint: #5d6772; --code: #0e1114;
      --accent: #33c7b0; --accent-soft: #0f2c28; --good: #4cd98a; --good-soft: #0f2618; --bad: #f2766b; --bad-soft: #301513;
      --warm: #f2b63c; --warm-soft: #30250f; --violet: #a28bf7; --violet-soft: #221b38; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); display: flex; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .label, th, .kpi span, .card > header h2, .section-title h2, .spec .k, .stages div, .cells span, .turn h3, .tree .label {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .kpi b, .tile .big, .cells b, td.n, .figure { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* The hierarchy, on the left */
  aside { width: 312px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .brand .mark-logo { width: 26px; height: 26px; border-radius: 3px; background: var(--ink); color: var(--panel); display: grid; place-items: center;
                      font: 700 12px var(--mono); flex: none; box-shadow: 3px 3px 0 var(--accent); }
  .brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
  .brand small { display: block; color: var(--quiet); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree { overflow-y: auto; padding: 6px 10px 24px; flex: 1; }
  .tree .label { color: var(--faint); padding: 16px 8px 6px; }
  .node { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 3px; color: var(--quiet); font-size: 13px; min-width: 0; }
  .node:hover { background: var(--raised); color: var(--ink); }
  .node.current { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
  .node .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .num { font: 600 12px var(--mono); color: var(--ink); }
  .node.top { color: var(--ink); font-weight: 600; font-size: 14px; }
  .node .tag { font: 11px var(--mono); color: var(--faint); white-space: nowrap; }
  .twist { width: 16px; height: 16px; flex: none; display: grid; place-items: center; border: 0; background: none; padding: 0; cursor: pointer;
           color: var(--faint); border-radius: 2px; }
  .twist:hover { color: var(--ink); background: var(--line); }
  .twist svg { transition: transform .15s; } .twist.open svg { transform: rotate(90deg); }
  .twist.none { visibility: hidden; }
  .children { margin-left: 15px; border-left: 1px solid var(--line); padding-left: 4px; }
  .children { margin-left: 12px; }
  /* (laid out by what a row is, wherever it nests: a step, a group, an episode, a rollout) */
  .node.step, .node.group, .node.episode, .node.rollout { display: grid; gap: 6px; }
  .node.step { grid-template-columns: 16px 36px minmax(0, 1fr) auto; }
  .node.group { grid-template-columns: 16px 30px minmax(0, 1fr) 52px 44px; }
  .node.episode { grid-template-columns: 16px 26px 10px minmax(0, 1fr) 40px; }
  .node.rollout { grid-template-columns: 20px minmax(0, 1fr); }
  .children .node .dots { justify-content: flex-start; overflow: hidden; }
  .children .node .tag { text-align: right; }
  .dots { display: flex; gap: 3px; flex: none; }
  .dots i { width: 7px; height: 7px; border-radius: 1px; background: var(--line-strong); }
  .dots i.solved { background: var(--good); } .dots i.unsolved { background: var(--faint); } .dots i.failed { background: var(--bad); }
  .dots i.running { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }

  /* Content */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 50px; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font: 12px var(--mono); color: var(--quiet); flex: 1; min-width: 0; }
  .crumbs a:hover { color: var(--ink); } .crumbs .sep { color: var(--line-strong); } .crumbs b { color: var(--ink); font-weight: 600; }
  .live { display: flex; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--quiet); white-space: nowrap; text-transform: uppercase; letter-spacing: .06em; }
  main { flex: 1; overflow-y: auto; padding: 28px 32px 56px;
         background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
         background-size: 24px 24px; background-position: -1px -1px; }
  .page { max-width: 1400px; margin: 0 auto; display: grid; gap: 22px; }
  .head { display: grid; gap: 12px; }
  .head h1 { margin: 0; font-size: 28px; letter-spacing: -.025em; font-weight: 700; line-height: 1.15; text-wrap: balance; }
  .head .sub { color: var(--quiet); font-size: 14px; }
  .specs { display: flex; flex-wrap: wrap; gap: 10px 0; }
  .spec { display: grid; gap: 2px; padding: 0 18px; border-left: 1px solid var(--line-strong); min-width: 0; }
  .spec:first-child { padding-left: 0; border-left: 0; }
  .spec .k { color: var(--faint); }
  .spec .v { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .spec.good .v { color: var(--good); } .spec.bad .v { color: var(--bad); } .spec.warm .v { color: var(--warm); }
  .spec.accent .v { color: var(--accent); } .spec.violet .v { color: var(--violet); }
  .mark { display: inline-flex; align-items: center; gap: 7px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--quiet); white-space: nowrap; }
  .mark i { width: 8px; height: 8px; border-radius: 1px; background: var(--faint); }
  .mark.good i { background: var(--good); } .mark.bad i { background: var(--bad); } .mark.warm i { background: var(--warm); }
  .mark.violet i { background: var(--violet); } .mark.accent i { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .dot { width: 8px; height: 8px; border-radius: 1px; background: var(--faint); flex: none; display: inline-block; }
  .dot.running, .dot.alive { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
  .dot.completed { background: var(--good); } .dot.failed, .dot.cancelled, .dot.gone { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot, .dots i, .mark i, .stages div::before, .cell::before { animation: none !important; } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); border: 1px solid var(--line);
          background: var(--panel); border-radius: 3px; }
  .kpi { padding: 14px 18px 15px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
  .kpi span { color: var(--faint); }
  .kpi b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.03em; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi small { display: block; color: var(--quiet); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; min-width: 0; }
  .card > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px;
                   padding: 11px 18px 10px; border-bottom: 1px solid var(--line); }
  .card > header span { color: var(--quiet); font-size: 12px; }
  .card .body { padding: 14px 18px 16px; min-width: 0; }
  .section-title { display: flex; align-items: center; gap: 14px; margin: 6px 0 -6px; }
  .section-title h2 { margin: 0; color: var(--ink); }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line-strong); order: 1; }
  .section-title span { order: 2; color: var(--quiet); font-size: 12px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 22px; align-items: start; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px 15px; display: grid; gap: 12px;
          min-width: 0; align-content: start; transition: border-color .12s, box-shadow .12s; }
  a.tile:hover { border-color: var(--line-strong); box-shadow: 4px 4px 0 var(--line); }
  .tile.rail { box-shadow: inset 3px 0 0 var(--faint); padding-left: 19px; }
  .tile.rail.good { box-shadow: inset 3px 0 0 var(--good); } .tile.rail.bad { box-shadow: inset 3px 0 0 var(--bad); }
  .tile.rail.accent { box-shadow: inset 3px 0 0 var(--accent); } .tile.rail.violet { box-shadow: inset 3px 0 0 var(--violet); }
  a.tile.rail:hover { box-shadow: inset 3px 0 0 var(--accent), 4px 4px 0 var(--line); }
  .tile header { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tile header b { font-size: 15px; white-space: nowrap; }
  .tile header span.what { color: var(--quiet); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tile .big { font-size: 30px; font-weight: 600; letter-spacing: -.04em; line-height: 1.05; }
  .tile .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--quiet); font-size: 12px; }
  .tile .facts b { color: var(--ink); font-weight: 600; font-family: var(--mono); }
  .muted { color: var(--quiet); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .empty { color: var(--quiet); padding: 28px 0; text-align: center; font: 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .error-text { color: var(--bad); overflow-wrap: anywhere; font-size: 13px; }

  /* The stages a group passes through */
  .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
  .stages div { display: grid; gap: 6px; color: var(--faint); min-width: 0; font-size: 9.5px; }
  .stages div::before { content: ""; height: 6px; background: var(--line); }
  .stages .done { color: var(--quiet); } .stages .done::before { background: var(--accent); opacity: .45; }
  .stages .now { color: var(--ink); } .stages .now::before { background: var(--accent); }
  .stages .now.active::before { animation: pulse 1.6s ease-in-out infinite; }
  .stages span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .cell { display: grid; gap: 1px; padding: 8px 10px 7px; border-right: 1px solid var(--line); position: relative; margin-right: -1px; background: var(--raised); }
  .cell::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--faint); }
  .cell.good::before { background: var(--good); } .cell.bad::before { background: var(--bad); } .cell.violet::before { background: var(--violet); }
  .cell.accent::before { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .cell span { color: var(--faint); font-size: 9.5px; } .cell b { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .cell small { color: var(--quiet); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Tables */
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--faint); padding: 0 14px 8px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
  tr:last-child td { border-bottom: 0; }
  tr.link { cursor: pointer; } tr.link:hover td { background: var(--raised); }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.key { font: 600 12.5px var(--mono); white-space: nowrap; }
  .moved { color: var(--good); } .still { color: var(--quiet); } .bad { color: var(--bad); }

  /* Charts */
  svg { display: block; max-width: 100%; }
  svg text { font: 10px var(--mono); fill: var(--faint); }
  .s-grid { stroke: var(--line); stroke-width: 1; }
  .s-accent { stroke: var(--accent); stroke-width: 1.75; fill: none; stroke-linejoin: round; }
  .s-violet { stroke: var(--violet); stroke-width: 1.75; fill: none; stroke-linejoin: round; }
  .s-warm { stroke: var(--warm); stroke-width: 1.75; fill: none; stroke-linejoin: round; }
  .s-ink { stroke: var(--ink); stroke-width: 1.5; }
  .f-accent { fill: var(--accent); } .f-accent-soft { fill: var(--accent); opacity: .12; } .f-violet { fill: var(--violet); }
  .f-violet-soft { fill: var(--violet); opacity: .12; } .f-warm { fill: var(--warm); } .f-warm-soft { fill: var(--warm); opacity: .12; }
  .f-good { fill: var(--good); } .f-quiet { fill: var(--faint); } .f-bad { fill: var(--bad); } .f-none { fill: transparent; }
  .f-hollow { fill: var(--panel); stroke: var(--faint); stroke-width: 1; }
  .column { cursor: pointer; } .column:hover { fill: var(--accent); fill-opacity: .07; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--quiet); font-size: 12px; margin-top: 10px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 6px; }
  .legend i.hollow { border: 1px solid var(--faint); }
  .legend i.rule { width: 12px; height: 2px; vertical-align: 3px; background: var(--ink); }
  .meter { display: grid; gap: 6px; margin-bottom: 16px; }
  .meter div:first-child { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--quiet); }
  .meter b { color: var(--ink); font: 600 12px var(--mono); }
  .track { height: 8px; background: var(--code); border: 1px solid var(--line); }
  .track i { display: block; height: 100%; background: var(--accent); }
  .track.warm i { background: var(--warm); } .track.bad i { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: 12px var(--mono); padding: 1px 7px; border-radius: 2px; background: var(--raised); border: 1px solid var(--line); }
  .chip b { font-weight: 600; }
  .pairs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; margin: 0; }
  .pairs dt { color: var(--quiet); } .pairs dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12.5px; min-width: 0; }

  /* A rollout: its trajectories, one per agent */
  .segmented { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; background: var(--panel); justify-self: start; }
  .seg { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border: 0; border-right: 1px solid var(--line);
         background: none; cursor: pointer; font-size: 13px; font-weight: 500; }
  .seg:first-child { padding-left: 14px; } .seg:last-child { border-right: 0; }
  .seg:hover { background: var(--raised); }
  .seg.current { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .avatar { width: 20px; height: 20px; border-radius: 2px; display: grid; place-items: center; color: #fff; font: 700 11px var(--mono); flex: none; text-transform: uppercase; }
  .scrub { position: sticky; top: -28px; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
           padding: 9px 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 3px; }
  .scrub input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .scrub button { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 2px; padding: 2px 11px; cursor: pointer; font-family: var(--mono); }
  .scrub .seg { border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 4px 12px; font-family: var(--sans); background: none; }
  .scrub .seg.current { background: var(--accent-soft); }
  .scrub output { font: 600 12px var(--mono); min-width: 120px; text-transform: uppercase; letter-spacing: .04em; }
  .scrub label { color: var(--quiet); font-size: 13px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .page.wide { max-width: none; }
  .turns-frame { overflow-x: auto; }
  .turns { display: grid; gap: 14px; align-items: start; }
  .timeline { display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; min-width: min-content; }
  .timeline > div { padding: 8px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .timeline > div:nth-child(n) { overflow-wrap: anywhere; }
  .timeline .head { position: sticky; top: -28px; z-index: 2; background: var(--raised); display: flex; align-items: center; gap: 8px;
                    border-bottom: 1px solid var(--line-strong); }
  .timeline .when { font: 600 11px var(--mono); color: var(--faint); text-align: right; background: var(--raised); }
  .timeline .step { display: grid; gap: 5px; align-content: start; font-size: 13px; }
  .timeline .step .result { font-size: 12.5px; }
  .timeline .folds { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
  .timeline .folds details { flex-basis: 100%; } .timeline .folds details:not([open]) { flex-basis: auto; }
  .timeline details summary { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .timeline .thought { margin: 6px 0 2px; white-space: pre-wrap; color: var(--quiet); font-size: 12.5px; }
  .timeline .sees pre { margin-top: 6px; max-height: 420px; }
  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; min-width: 0; overflow: hidden; }
  .turn > header { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .turn > header b { font-size: 14px; } .turn > header span { margin-left: auto; color: var(--quiet); font: 11px var(--mono); }
  .turn section { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .turn section:last-child { border-bottom: 0; }
  .turn h3 { margin: 0 0 6px; color: var(--faint); font-size: 9.5px; }
  pre { margin: 0; font: 12px/1.35 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .sees pre { background: var(--code); padding: 10px; max-height: 620px; overflow: auto; border: 1px solid var(--line); }
  .thinks p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; color: var(--quiet); max-height: 320px; overflow: auto; }
  .call { display: inline-block; font: 12px var(--mono); color: var(--accent); background: var(--accent-soft); border-left: 2px solid var(--accent);
          padding: 3px 8px; overflow-wrap: anywhere; }
  .said { margin: 0 0 6px; font-size: 13px; }
  .result { color: var(--quiet); overflow-wrap: anywhere; white-space: pre-wrap; font-size: 13px; }
  .result.error { color: var(--bad); }
  .none { color: var(--faint); font-size: 13px; }
  .row { white-space: pre; }
  .c-solid { color: var(--quiet); } .c-air { color: var(--faint); } .c-unseen { color: var(--faint); opacity: .45; }
  .c-self { color: var(--accent); font-weight: 700; } .c-mate { color: var(--warm); font-weight: 700; } .c-thing { color: var(--ink); font-weight: 700; }
  details summary { cursor: pointer; color: var(--quiet); font-size: 13px; padding: 2px 0; }
  .menu { display: none; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 3px; padding: 3px 10px; cursor: pointer; }

  @media (max-width: 900px) {
    body { display: block; height: auto; }
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 6px 0 0 var(--line); }
    body.open aside { transform: none; }
    .content { min-height: 100vh; }
    main { padding: 18px 16px; overflow: visible; }
    .bar { padding: 0 16px; position: sticky; top: 0; z-index: 5; }
    .menu { display: block; }
    .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .scrub { top: 50px; }
    .spec { padding: 0 12px; }

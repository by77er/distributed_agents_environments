[project]
name = "minecraft-horizons"
version = "0.0.0"
description = "Minecraft objectives with no ceiling, each against a budget of game time the agents see: an environment for rollout"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "minecraft-team",
]

[project.entry-points."rollout.environments"]  # what an import from git takes (docs/guide/publishing.md)
minecraft-horizons = "minecraft_horizons.environment:environment"

[tool.uv.sources]
rollout = { workspace = true }
minecraft-team = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minecraft_horizons"]

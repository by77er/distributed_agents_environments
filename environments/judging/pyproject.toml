[project]
name = "judging"
version = "0.0.0"
description = "Open-ended answers scored by a judge against a rubric the environment holds: an environment for rollout"
requires-python = ">=3.13"
dependencies = [
    "rollout",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judging"]

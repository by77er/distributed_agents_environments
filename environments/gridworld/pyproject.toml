[project]
name = "gridworld"
version = "0.0.0"
description = "Two to four agents share out the plates of a grid level and talk it over: an environment for rollout"
requires-python = ">=3.13"
dependencies = [
    "rollout",
]

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridworld"]

# Settings every episode server starts with (merged into Paper's defaults; the port and seed are set per server).
online-mode=false
server-ip=127.0.0.1
enforce-secure-profile=false
spawn-protection=0
view-distance=6
simulation-distance=6
max-players=16
# Bots pause their physics while ticks are frozen: do not kick them for floating.
allow-flight=true
allow-nether=false
enable-command-block=false
sync-chunk-writes=false
difficulty=peaceful
gamemode=survival
motd=rollout minecraft swarm

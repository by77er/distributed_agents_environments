[project]
name = "minecraft-team"
version = "0.0.0"
description = "One to four agents in a Minecraft world, as a team: an environment for rollout"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "pyyaml>=6",
]

[project.scripts]
minecraft-team = "minecraft_team.cli:main"

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minecraft_team"]

[project]
name = "minecraft-swarm"
version = "0.0.0"
description = "Four agents in a Minecraft world: an environment for rollout"
requires-python = ">=3.13"
dependencies = [
    "rollout",
    "pyyaml>=6",
]

[project.scripts]
minecraft-swarm = "minecraft_swarm.cli:main"

[tool.uv.sources]
rollout = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minecraft_swarm"]

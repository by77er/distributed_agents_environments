# The full Qwen3.5-9B (bfloat16), trained and sampled at Thinking Machines (Tinker); the Paper servers and the runner
# stay on this machine, and nothing here uses its GPU. Its settings are one-gpu.toml's where they still apply. Run it
# from the rollout-tinker project, whose environment has Tinker's SDK (docs/implementations/rollout-tinker.md):
#   cd implementations/rollout-tinker
#   uv run rollout train ../../environments/minecraft/profiles/tinker.toml minecraft_team.environment:environment --groups 30
# The key comes from TINKER_API_KEY or `tinker auth login`, never from this file. Cost, from curriculum-9's numbers:
# about $8 to $18 a step of 384 segments, $230 to $520 for a run as long as curriculum-9's 72 groups and 31 steps.
directory = "~/.cache/rollout/runs/team-tinker"
feed_runs = 80
episodes_at_once = 6             # each a Paper server of its own: this machine's memory, not a GPU, is the limit

[ledger]                         # the database every run on this machine shares
kind = "rollout_train.database:DatabaseLedger"
url = "sqlite:///~/.cache/rollout/ledger.db"

[channels.policy]
model = "Qwen/Qwen3.5-9B"        # Tinker's id and the Hub's: rollout_qwen:qwen35 loads its tokenizer from the Hub
renderer = "rollout_qwen:qwen35"
engine = "rollout_tinker:TinkerEngine"
thinking_tokens = 1024           # as one-gpu.toml: thoughts run to a median of 530 tokens, a 95th percentile of 820
answer_tokens = 400
engines = [{ max_model_len = 8192 }]  # Tinker takes 64K; one-gpu.toml's 8,192 keeps turns as they were

[trainer]
kind = "rollout_tinker:TinkerTrainer"
channel = "policy"
rank = 32
learning_rate = 1e-4             # one-gpu.toml's 5e-5, doubled: Tinker's adapters are scaled half as much as ours
segment_tokens = 8000            # as one-gpu.toml (curriculum-9's longest segment was 7,094 tokens)
segments_per_step = 384
tokens_per_step = 16384          # about six updates a step (curriculum-9 made twenty at 4,096); one (a larger
                                 # number) needs no pass for where the step starts, and halves the training's cost
# weights = "peft"               # keep each adapter too (downloaded each step): to serve or merge it here

[tools]
minecraft = "minecraft_team.worlds:tools"

[memory]
runs_gib = 6                     # each episode runs a Paper server

# Serving on this machine instead, Tinker training (`weights = "peft"` above): the full model in FP8 does not fit the
# 16 GB card. Quantized as it loads (vLLM's `quantization = "fp8"`), its weights take 10.8 GiB, and at 0.88 of the card
# (the most that is free beside the 1.5 GiB other programs hold) with 1,024-token batches, 0.25 GiB is left for the cache: not
# one 8,192-token turn (0.35 GiB). What fits is one-gpu.toml's 4-bit checkpoint serving Tinker's adapter (trained over
# bfloat16: `kl_floor` and `mean_mismatch` measure the difference). At 0.78 of the card it holds 85,000 tokens of cache
# (ten 8,192-token turns) with an adapter of rank 32, and 15,600 (two) with one of rank 96: Tinker's q, k and v of a
# linear-attention layer joined, if they come with an A each (`rollout_tinker.weights.ranks` says which).
# [channels.policy]
# model = "cyankiwi/Qwen3.5-9B-AWQ-4bit"
# renderer = "rollout_qwen:qwen35"
# engine = "rollout_vllm:VllmEngine"
# thinking_tokens = 1024
# answer_tokens = 400

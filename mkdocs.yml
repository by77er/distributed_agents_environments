# Local HTML documentation: `uv run --group docs mkdocs serve` (live) or `mkdocs build` (writes site/).
site_name: rollout
site_description: Reinforcement learning for agents, from one GPU to a cluster
docs_dir: docs
site_dir: site
use_directory_urls: false  # the built site also works when opened straight from disk

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}  # GitHub-compatible anchors
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search

# Every page under docs/ appears here once, in the order of docs/README.md.
nav:

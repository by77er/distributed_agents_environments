# Local HTML documentation: `uv run --group docs mkdocs serve` (live) or `mkdocs build` (writes site/).
site_name: rollout
site_description: Durable, scalable agents and environments for agent products and reinforcement learning
docs_dir: docs
site_dir: site
use_directory_urls: false  # the built site also works when opened straight from disk

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}  # GitHub-compatible anchors
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search

nav:
  - Home: README.md
  - Developer guide:
      - guide/README.md
      - "Three ways in": guide/perspectives.md
      - "Getting started": guide/getting-started.md
      - "Tasks": guide/tasks.md
      - "Tools": guide/tools.md
      - "Agents": guide/agents.md
      - "Conversations": guide/conversations.md
      - "Content": guide/content.md
      - "Models": guide/models.md
      - "Runs and events": guide/runs-and-events.md
      - "Testing": guide/testing.md
      - "Deploying": guide/deploying.md
      - "API reference": guide/reference.md
  - Architecture:
      - "Overview": architecture/overview.md
      - "Glossary": architecture/glossary.md
  - Contracts:
      - contracts/README.md
      - "Identifiers": contracts/identifiers.md
      - "Canonical content": contracts/canonical-content.md
      - "Run events": contracts/run-events.md
      - "Effects": contracts/effects.md
      - "Model endpoint contract": contracts/model-endpoint.md
  - Core:
      - Harness:
          - core/harness/README.md
          - "Determinism rules for durable code": core/harness/determinism.md
          - "Hooks": core/harness/hooks.md
          - "Memory": core/harness/memory.md
      - Recorder:
          - core/recorder/README.md
          - "The recorder over HTTP": core/recorder/session-api.md
          - "Epochs": core/recorder/session-tree.md
          - "Engines": core/recorder/engine-adapter.md
      - "Rollouts": core/rollouts/README.md
      - "Episodes": core/trajectories/README.md
      - "Training": core/training.md
      - "Monitor": core/monitor.md
  - Inference: inference/README.md
  - Durability:
      - durability/README.md
      - "Evicting idle runs": durability/eviction.md
      - "Several runners": durability/runners.md
  - Environments: environments/README.md
  - Products:
      - "Project assistant": products/project-assistant.md
      - "Agent sessions": products/agent-sessions.md
      - "Minecraft swarm": products/minecraft-swarm.md
  - Local services: development/local-services.md

# The checks every change must pass, on CPU alone: ruff, the tests (the chart's among them, with Helm, which they skip
# without) and the monitor's page (its types, its lint and its tests). Tests that need the GPU extras skip without
# them; pyright needs those extras too, so it is run where they are installed. Nothing here writes: the token reads.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff and the tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with: {enable-cache: true}
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0
        with: {version: v3.16.4}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: helm lint deploy/chart/rollout
      - run: uv run --frozen pytest -q  # (`-m "not live"` is the default: no GPU, no Paper server)

  web:
    name: the monitor's page
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {working-directory: libraries/rollout-train/web}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: libraries/rollout-train/web/package-lock.json
      - run: npm ci
      - run: npm run check  # (tsc -b and eslint)
      - run: npm test
